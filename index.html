<!DOCTYPE html>
<html lang="en" data-theme="auto">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>do things</title>
  <meta name="description"
    content="Weekly curated events guide for Brisbane, Gold Coast and Sunshine Coast — talks, workshops, live music, art, comedy, and more.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.brissy.lol/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="do things">
  <meta property="og:description"
    content="Weekly curated events guide for Brisbane, Gold Coast and Sunshine Coast — talks, workshops, live music, art, comedy, and more.">
  <meta property="og:url" content="https://www.brissy.lol/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="do things">
  <meta name="twitter:description"
    content="Weekly curated events guide for Brisbane, Gold Coast and Sunshine Coast — talks, workshops, live music, art, comedy, and more.">
  <script src="https://app.rybbit.io/api/script.js" data-site-id="0f3ec51f30bf" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
  <!-- Apply saved theme before first paint to prevent flash -->
  <script>const t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t);</script>

  <style>
    /* ── Monochrome token layer ── */
    :root {
      --pico-font-family-sans-serif: 'Inter', system-ui, -apple-system, sans-serif;
      --pico-font-size: 15px;
      --pico-line-height: 1.55;
      --pico-border-radius: 0px;
      --pico-card-box-shadow: none;
      --pico-form-element-spacing-vertical: .4rem;
      --pico-form-element-spacing-horizontal: .75rem;

      --bg: #fff;
      --fg: #0a0a0a;
      --muted: #666;
      --border: #ddd;
      --surface: #fff;
      --mono: 'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace;

      --pico-background-color: var(--bg);
      --pico-color: var(--fg);
      --pico-muted-color: var(--muted);
      --pico-muted-border-color: var(--border);
      --pico-card-background-color: var(--surface);
      --pico-card-border-color: var(--border);
      --pico-primary: var(--fg);
      --pico-primary-hover: #333;
      --pico-primary-focus: rgba(0, 0, 0, .1);
      --pico-primary-inverse: #fff;
      --pico-secondary: var(--muted);
      --pico-h1-color: var(--fg);
      --pico-h2-color: var(--fg);
      --pico-h3-color: var(--fg);
    }

    /* Dark tokens — system preference (auto) or explicit toggle */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0b0b;
        --fg: #ededed;
        --muted: #888;
        --border: #242424;
        --surface: #111;
        --pico-background-color: var(--bg);
        --pico-color: var(--fg);
        --pico-muted-color: var(--muted);
        --pico-muted-border-color: var(--border);
        --pico-card-background-color: var(--surface);
        --pico-card-border-color: var(--border);
        --pico-primary: var(--fg);
        --pico-primary-hover: #bbb;
        --pico-primary-focus: rgba(255, 255, 255, .1);
        --pico-primary-inverse: #0b0b0b;
        --pico-h1-color: var(--fg);
        --pico-h2-color: var(--fg);
        --pico-h3-color: var(--fg);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b0b0b;
      --fg: #ededed;
      --muted: #888;
      --border: #242424;
      --surface: #111;
      --pico-background-color: var(--bg);
      --pico-color: var(--fg);
      --pico-muted-color: var(--muted);
      --pico-muted-border-color: var(--border);
      --pico-card-background-color: var(--surface);
      --pico-card-border-color: var(--border);
      --pico-primary: var(--fg);
      --pico-primary-hover: #bbb;
      --pico-primary-focus: rgba(255, 255, 255, .1);
      --pico-primary-inverse: #0b0b0b;
      --pico-h1-color: var(--fg);
      --pico-h2-color: var(--fg);
      --pico-h3-color: var(--fg);
    }

    /* ── Layout ── */
    body {
      max-width: 1320px;
      margin: auto auto;
    }

    /* ── Site header ── */
    header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding-top: 1.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .site-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -.025em;
      margin: 0;
      line-height: 1;
      color: var(--fg);
    }

    .header-meta {
      font-size: .8rem;
      color: var(--muted);
      margin: 0;
    }

    /* ── Header controls (right side) ── */
    .header-controls {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: .4rem;
      flex-shrink: 0;
    }

    /* ── Theme toggle button ── */
    .theme-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.6rem;
      height: 1.6rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      padding: 0;
      border-radius: 0;
      flex-shrink: 0;
      box-shadow: none;
    }

    .theme-btn:hover {
      border-color: var(--fg);
    }

    .theme-btn svg {
      width: 12px;
      height: 12px;
      stroke-width: 2;
    }

    /* ── City selector ── */
    .city-select {
      width: auto;
      max-width: 250px;
      font-family: var(--mono);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      padding: .18rem .5rem;
      cursor: pointer;
      border-radius: 0;
      outline: none;
      height: auto;
      box-shadow: none;
      margin-bottom: 0px;
    }

    .city-select:hover {
      border-color: var(--fg);
    }

    .city-select:focus {
      border-color: var(--fg);
    }

    .city-select option {
      background: var(--bg);
      color: var(--fg);
    }

    /* ── Section labels ── */
    .section-label {
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 1.5rem 0 .6rem;
    }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
    }

    .separator {
      height: 1px;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: .3rem;
      padding: .75rem 0;
    }

    .filter-btn {
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-family: var(--mono);
      padding: .2rem .6rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .12s, color .12s, background .12s;
      line-height: 1.7;
      border-radius: 0;
    }

    .filter-btn:hover {
      border-color: var(--fg);
      color: var(--fg);
      background: transparent;
    }

    .filter-btn.active {
      border-color: var(--fg);
      background: var(--fg);
      color: var(--bg);
    }

    .filter-sep {
      width: 1px;
      height: 1.2em;
      background: var(--border);
      align-self: center;
      flex-shrink: 0;
    }

    /* ── Card grid (background = border colour trick for gapless grid) ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 10px;
      background: var(--bg);
      border: none;
      margin-bottom: 2rem;
    }

    /* ── Card ── */
    article.card {
      display: flex;
      flex-direction: column;
      gap: .65rem;
      padding: 1.25rem;
      background: var(--surface);
      position: relative;
      overflow: hidden;
      /* reset pico article defaults */
      border: 1px solid var(--border);
      border-radius: 0;
      box-shadow: none;
      margin: 0;
    }

    article.card>header,
    article.card>footer {
      border: none;
      padding: 0;
      margin: 0;
      background: none;
    }

    /* Top-pick accent: inset left rule */
    article.card.top-pick {
      box-shadow: inset 3px 0 0 var(--fg);
    }

    /* ── Card background image ── */
    article.card.has-image::before {
      content: "";
      position: absolute;
      inset: -12px;
      background-image: var(--event-image, none);
      background-size: cover;
      background-position: center top;
      filter: blur(10px);
      opacity: .28;
      z-index: 0;
    }

    article.card.has-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--surface);
      opacity: .86;
      z-index: 1;
    }

    article.card.has-image>* {
      position: relative;
      z-index: 2;
    }

    /* ── Card top row ── */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .5rem;
    }

    .card-cat {
      display: flex;
      align-items: center;
      gap: .3rem;
      font-size: .72rem;
      font-weight: 500;
      color: var(--muted);
    }

    .card-cat svg {
      width: 11px;
      height: 11px;
      stroke-width: 2.2;
      flex-shrink: 0;
    }

    .card-cost {
      font-family: var(--mono);
      font-size: .68rem;
      font-weight: 600;
      padding: .1rem .45rem;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card-cost.free {
      border-color: var(--fg);
      color: var(--fg);
    }

    /* ── Card title ── */
    .card-title {
      font-size: .95rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -.02em;
      margin: 0;
    }

    .card-title a {
      color: var(--fg);
      text-decoration: none;
    }

    .card-title a:hover {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
    }

    .top-mark {
      color: var(--fg);
      margin-right: .15rem;
      font-style: normal;
    }

    /* ── Card meta ── */
    .card-meta {
      display: flex;
      flex-direction: column;
      gap: .2rem;
    }

    .meta-row {
      display: flex;
      align-items: flex-start;
      gap: .35rem;
      font-size: .78rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .meta-row svg {
      width: 11px;
      height: 11px;
      stroke-width: 2.2;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* ── Description ── */
    .card-desc {
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.55;
      margin: 0;
      flex-grow: 1;
    }

    /* ── Tags ── */
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: .3rem;
      margin-top: auto;
      padding-top: .15rem;
    }

    .tag {
      font-family: var(--mono);
      font-size: .67rem;
      padding: .1rem .42rem;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    /* ── States ── */
    .state {
      padding: 5rem 0;
      text-align: center;
      color: var(--muted);
    }

    .state h2 {
      color: var(--fg);
      font-size: .95rem;
      font-weight: 600;
      margin-bottom: .4rem;
    }

    .state p {
      font-size: .85rem;
    }

    .hidden {
      display: none !important;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <span class="site-name">&gt;&nbsp;do things</span>
    <span class="header-meta" id="header-meta">loading…</span>
    <div class="header-controls">
      <select id="city-select" class="city-select hidden"></select>
      <a id="cal-btn" class="theme-btn hidden" aria-label="Subscribe to calendar" title="Download calendar (.ics)"
        download><i data-lucide="calendar"></i></a>
      <button id="theme-btn" class="theme-btn" aria-label="Toggle dark mode"><i data-lucide="moon"></i></button>
    </div>
  </header>

  <main>
    <div class="state" id="loading-state">
      <h2>loading…</h2>
    </div>

    <div class="state hidden" id="error-state">
      <h2 id="error-message">could not load events</h2>
      <p>check back after the next monday run</p>
    </div>

    <div id="content" class="hidden">
      <div class="filter-bar" id="filter-bar"></div>
      <div id="top-picks-section">
        <div class="section-label">picks</div>
        <div class="card-grid" id="top-picks-grid"></div>
      </div>

      <div class="section-label">all events</div>
      <div class="separator"></div>
      <div class="card-grid" id="all-events-grid"></div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    const CAT_ICON = {
      "Public Lecture": "book-open",
      "Workshop / Class": "wrench",
      "Concert / Music": "music",
      "Social / Meetup": "users",
      "Arts / Exhibition": "palette",
      "Community / Other": "compass",
    };

    const TOP_PICK_THRESHOLD = 8;

    let activeCat = "All";
    let activeDate = null;

    // Use local calendar date (not UTC) to avoid off-by-one for UTC+ timezones
    function localDateStr(offset) {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), d.getDate() + offset).toLocaleDateString("sv");
    }
    function todayIso() { return localDateStr(0); }
    function tomorrowIso() { return localDateStr(1); }

    const MONTH_NUM = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

    // Returns end date YYYY-MM-DD for range strings; falls back to start for single events.
    function parseEndDate(dt, startIso) {
      if (!startIso) return "";
      const year = startIso.slice(0, 4);
      const pad = n => String(n).padStart(2, "0");
      const short = dt.match(/\b(\d{1,2})\s*[\u2013\u2014\-]\s*(\d{1,2})\s+([A-Za-z]{3})\b/);
      if (short) { const mon = MONTH_NUM[short[3].toLowerCase()]; if (mon) return `${year}-${pad(mon)}-${pad(+short[2])}`; }
      const all = [...dt.matchAll(/\b(\d{1,2})\s+([A-Za-z]{3})\b/g)];
      if (all.length >= 2) { const last = all[all.length - 1]; const mon = MONTH_NUM[last[2].toLowerCase()]; if (mon) return `${year}-${pad(mon)}-${pad(+last[1])}`; }
      return startIso.slice(0, 10);
    }

    function applyFilters() {
      document.querySelectorAll("#top-picks-grid .card, #all-events-grid .card").forEach(c => {
        const catOk = activeCat === "All" || c.dataset.category === activeCat;
        let dateOk;
        if (!activeDate) {
          dateOk = true;
        } else if (!c.dataset.date) {
          dateOk = false;
        } else {
          const end = c.dataset.dateEnd || c.dataset.date;
          dateOk = c.dataset.date <= activeDate && activeDate <= end;
        }
        c.classList.toggle("hidden", !(catOk && dateOk));
      });
    }

    function cacheBust() {
      return new Date().toISOString().slice(0, 10);
    }

    function fmtRange(a, b) {
      const fmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-AU", {
        day: "numeric", month: "short"
      });
      return `${fmt(a)} – ${fmt(b)}`;
    }

    function ic(name) {
      return `<i data-lucide="${name}"></i>`;
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function buildCard(ev, isTop) {
      const free = (ev.cost || "").toLowerCase() === "free";
      const catIcon = CAT_ICON[ev.category] || "compass";
      const el = document.createElement("article");

      el.className = "card" + (isTop ? " top-pick" : "");
      el.dataset.category = ev.category || "";
      el.dataset.date = ev.datetime_iso ? ev.datetime_iso.slice(0, 10) : "";
      el.dataset.dateEnd = ev.datetime_iso ? parseEndDate(ev.datetime || "", ev.datetime_iso) : "";

      if (ev.image) {
        el.style.setProperty("--event-image", `url('${esc(ev.image)}')`);
        el.classList.add("has-image");
      }

      const titleContent = ev.link
        ? `<a href="${esc(ev.link)}" target="_blank" rel="noopener">${esc(ev.title)}</a>`
        : esc(ev.title);

      const tagsHtml = (ev.tags || []).slice(0, 5)
        .map(t => `<span class="tag">${esc(t)}</span>`).join("");

      el.innerHTML = `
      <div class="card-top">
        <span class="card-cat">${ic(catIcon)} ${esc(ev.category || "")}</span>
        <span class="card-cost${free ? " free" : ""}">${free ? "free" : esc(ev.cost || "—")}</span>
      </div>
      <h3 class="card-title">${isTop ? '<em class="top-mark">✦</em>' : ""}${titleContent}</h3>
      <div class="card-meta">
        <span class="meta-row">${ic("calendar-days")} ${esc(ev.datetime || "—")}</span>
        <span class="meta-row">${ic("map-pin")} ${esc(ev.location || "—")}</span>
      </div>
      ${ev.description ? `<p class="card-desc">${esc(ev.description)}</p>` : ""}
      ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ""}
    `;
      return el;
    }

    function renderFilters(cats) {
      const bar = document.getElementById("filter-bar");
      const categoryFilters = document.createElement("span");
      const dateFilters = document.createElement("span");
      dateFilters.className = "filters";
      categoryFilters.className = "filters";
      bar.appendChild(categoryFilters);
      bar.appendChild(dateFilters);


      // Category filters
      ["All", ...cats].forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "filter-btn" + (cat === "All" ? " active" : "");
        btn.textContent = cat;
        btn.addEventListener("click", () => {
          categoryFilters.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          activeCat = cat;
          applyFilters();
        });
        categoryFilters.appendChild(btn);
      });



      // Date quick-filters (toggle: click again to deactivate)
      [["Today", todayIso()], ["Tomorrow", tomorrowIso()]].forEach(([label, date]) => {
        const btn = document.createElement("button");
        btn.className = "filter-btn date-filter";
        btn.textContent = label;
        btn.addEventListener("click", () => {
          const wasActive = btn.classList.contains("active");
          dateFilters.querySelectorAll(".date-filter").forEach(b => b.classList.remove("active"));
          activeDate = wasActive ? null : date;
          if (!wasActive) btn.classList.add("active");
          applyFilters();
        });
        dateFilters.appendChild(btn);
      });
    }

    async function loadCity(city) {
      // Reset
      activeCat = "All";
      activeDate = null;
      document.getElementById("content").classList.add("hidden");
      document.getElementById("error-state").classList.add("hidden");
      document.getElementById("loading-state").classList.remove("hidden");
      document.getElementById("top-picks-grid").innerHTML = "";
      document.getElementById("all-events-grid").innerHTML = "";
      document.getElementById("filter-bar").innerHTML = "";
      document.getElementById("top-picks-section").classList.remove("hidden");

      try {
        const res = await fetch(`data/${city}.json?v=${cacheBust()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        document.title = `${data.city} — do things`;
        const calBtn = document.getElementById("cal-btn");
        calBtn.href = `${city}.ics`;
        calBtn.classList.remove("hidden");
        document.getElementById("header-meta").textContent =
          `${fmtRange(data.week_start, data.week_end)} · ${data.events.length} events`;

        const picks = data.events.filter((e, i) => (e.score || 0) >= TOP_PICK_THRESHOLD && i < 9);
        picks.sort((a, b) => (b.score || 0) - (a.score || 0)); // re-sort picks by score desc (not original order)
        const rest = data.events.filter((e, i) => (e.score || 0) < TOP_PICK_THRESHOLD || i >= 9);

        const topGrid = document.getElementById("top-picks-grid");
        if (picks.length) {
          picks.forEach(e => topGrid.appendChild(buildCard(e, true)));
        } else {
          document.getElementById("top-picks-section").classList.add("hidden");
        }

        const allGrid = document.getElementById("all-events-grid");
        const cats = [...new Set(rest.map(e => e.category).filter(Boolean))];
        renderFilters(cats);
        rest.forEach(e => allGrid.appendChild(buildCard(e, false)));

        document.getElementById("loading-state").classList.add("hidden");
        document.getElementById("content").classList.remove("hidden");

        lucide.createIcons();
        syncThemeIcon();

      } catch (err) {
        document.getElementById("loading-state").classList.add("hidden");
        document.getElementById("error-message").textContent =
          `could not load events for "${city}": ${err.message}`;
        document.getElementById("error-state").classList.remove("hidden");
      }
    }

    function effectiveTheme() {
      const attr = document.documentElement.getAttribute("data-theme");
      if (attr === "dark" || attr === "light") return attr;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function syncThemeIcon() {
      const btn = document.getElementById("theme-btn");
      btn.innerHTML = `<i data-lucide="${effectiveTheme() === "dark" ? "sun" : "moon"}"></i>`;
      lucide.createIcons({ nodes: [btn] });
    }

    document.getElementById("theme-btn").addEventListener("click", () => {
      const next = effectiveTheme() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      syncThemeIcon();
    });

    async function init() {
      const params = new URLSearchParams(location.search);
      let city = params.get("city");

      // Fetch city index to populate selector
      try {
        const res = await fetch(`data/index.json?v=${cacheBust()}`);
        if (res.ok) {
          const idx = await res.json();
          const cities = idx.cities || [];
          const keys = cities.map(c => c.key);

          if (!city || !keys.includes(city)) city = keys[0] || "brisbane";

          if (cities.length > 1) {
            const sel = document.getElementById("city-select");
            cities.forEach(c => {
              const opt = document.createElement("option");
              opt.value = c.key;
              opt.textContent = c.name.split(",")[0];
              if (c.key === city) opt.selected = true;
              sel.appendChild(opt);
            });
            sel.classList.remove("hidden");
            sel.addEventListener("change", () => {
              const next = sel.value;
              history.pushState({}, "", `?city=${next}`);
              loadCity(next);
            });
          }
        }
      } catch (_) { }

      city = city || "brisbane";
      loadCity(city);
    }

    init();
  </script>
</body>

</html>
