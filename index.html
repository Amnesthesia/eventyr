<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This Week's Events</title>
  <style>
    :root {
      --bg:           #f8f7f4;
      --surface:      #ffffff;
      --surface-alt:  #f2f0ec;
      --border:       #e5e2db;
      --text:         #1a1a1a;
      --text-muted:   #6b6860;
      --accent:       #2c6fad;
      --accent-light: #e8f0f9;
      --gold:         #c9860a;
      --gold-light:   #fdf4e3;
      --green:        #1a7a45;
      --green-light:  #e6f5ed;
      --radius:       12px;
      --shadow:       0 1px 3px rgba(0,0,0,.07), 0 4px 12px rgba(0,0,0,.05);
      --shadow-hover: 0 2px 6px rgba(0,0,0,.1),  0 8px 20px rgba(0,0,0,.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 24px 20px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .header-title { font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }
    .header-meta  { font-size: .875rem; color: var(--text-muted); }

    /* ── Main layout ── */
    main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }

    /* ── Section headings ── */
    .section-heading {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-heading + .card-grid { margin-bottom: 48px; }

    /* ── Category filter ── */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: .8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .filter-btn:hover  { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Card grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    @media (max-width: 640px) {
      .card-grid { grid-template-columns: 1fr; gap: 14px; }
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow .2s, transform .2s;
      overflow: hidden;
    }
    .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
    .card.top-pick { border-left: 3px solid var(--gold); background: var(--surface); }

    /* Card background image — renders as blurred bg; 404s are invisible */
    .card.has-image {
      background-image:
        linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.97) 55%, #fff 75%),
        var(--event-image, none);
      background-size: auto, cover;
      background-position: top left, center top;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .card.has-image.top-pick {
      background-image:
        linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.97) 55%, #fff 75%),
        var(--event-image, none);
    }

    /* Card header row */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .card-category {
      font-size: .75rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .top-pick-badge {
      font-size: .7rem;
      font-weight: 700;
      color: var(--gold);
      background: var(--gold-light);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .cost-badge {
      font-size: .75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .cost-free { background: var(--green-light); color: var(--green); }
    .cost-paid { background: var(--surface-alt); color: var(--text-muted); }

    /* Title */
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .card-title a { color: var(--text); text-decoration: none; }
    .card-title a:hover { color: var(--accent); }

    /* Meta rows */
    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: .85rem;
      color: var(--text-muted);
    }
    .card-meta span { display: flex; align-items: flex-start; gap: 6px; }

    /* Tags */
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: .72rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 500;
    }

    /* Description */
    .card-desc {
      font-size: .875rem;
      color: var(--text-muted);
      line-height: 1.55;
      flex-grow: 1;
    }

    /* ── States ── */
    .state {
      text-align: center;
      padding: 64px 20px;
      color: var(--text-muted);
    }
    .state-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .state h2   { font-size: 1.1rem; margin-bottom: 6px; color: var(--text); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-title" id="header-title">Loading…</div>
    <div class="header-meta"  id="header-meta"></div>
  </div>
</header>

<main id="main">
  <div class="state" id="loading-state">
    <div class="state-icon">🔍</div>
    <h2>Loading events…</h2>
  </div>
  <div class="state hidden" id="error-state">
    <div class="state-icon">⚠️</div>
    <h2 id="error-message">Could not load events</h2>
    <p>Check back after the next Monday run.</p>
  </div>
  <div id="content" class="hidden">
    <div id="top-picks-section">
      <h2 class="section-heading">⭐ Top Picks</h2>
      <div class="card-grid" id="top-picks-grid"></div>
    </div>
    <h2 class="section-heading">📋 All Events</h2>
    <div class="filter-row" id="filter-row"></div>
    <div class="card-grid" id="all-events-grid"></div>
  </div>
</main>

<script>
  const CATEGORY_EMOJI = {
    "Public Lecture":    "🎓",
    "Workshop / Class":  "🛠️",
    "Concert / Music":   "🎵",
    "Social / Meetup":   "🤝",
    "Arts / Exhibition": "🎨",
    "Community / Other": "📌",
  };

  const TOP_PICK_THRESHOLD = 8;

  function cacheBustParam() {
    // Refreshes once per day — Monday's new data is always picked up same day
    return new Date().toISOString().slice(0, 10);
  }

  function fmtDateRange(weekStart, weekEnd) {
    const fmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-AU", {
      day: "numeric", month: "short"
    });
    return `${fmt(weekStart)} – ${fmt(weekEnd)}`;
  }

  function buildCard(event, isTopPick) {
    const isFree = (event.cost || "").toLowerCase() === "free";
    const emoji  = CATEGORY_EMOJI[event.category] || "📌";

    const card = document.createElement("div");
    card.className = "card" + (isTopPick ? " top-pick" : "");
    card.dataset.category = event.category || "";

    const titleHtml = event.link
      ? `<a href="${escHtml(event.link)}" target="_blank" rel="noopener">${escHtml(event.title)}</a>`
      : escHtml(event.title);

    const tagsHtml = (event.tags || []).slice(0, 6)
      .map(t => `<span class="tag">${escHtml(t)}</span>`).join("");

    if (event.image) {
      card.style.setProperty("--event-image", `url('${escHtml(event.image)}')`);
      card.classList.add("has-image");
    }

    card.innerHTML = `
      <div class="card-header">
        <span class="card-category">${emoji} ${escHtml(event.category || "")}</span>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
          ${isTopPick ? '<span class="top-pick-badge">⭐ Top Pick</span>' : ""}
          <span class="cost-badge ${isFree ? "cost-free" : "cost-paid"}">${escHtml(event.cost || "—")}</span>
        </div>
      </div>
      <div class="card-title">${titleHtml}</div>
      <div class="card-meta">
        <span>📆 ${escHtml(event.datetime || "—")}</span>
        <span>📍 ${escHtml(event.location || "—")}</span>
      </div>
      ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ""}
      ${event.description ? `<p class="card-desc">${escHtml(event.description)}</p>` : ""}
    `;
    return card;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderFilters(categories, allGrid) {
    const row = document.getElementById("filter-row");
    const all = ["All", ...categories];
    all.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "filter-btn" + (cat === "All" ? " active" : "");
      btn.textContent = (CATEGORY_EMOJI[cat] ? CATEGORY_EMOJI[cat] + " " : "") + cat;
      btn.addEventListener("click", () => {
        row.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        allGrid.querySelectorAll(".card").forEach(card => {
          card.classList.toggle("hidden", cat !== "All" && card.dataset.category !== cat);
        });
      });
      row.appendChild(btn);
    });
  }

  async function load() {
    const params = new URLSearchParams(window.location.search);
    const city   = params.get("city") || "brisbane";
    const url    = `data/${city}.json?v=${cacheBustParam()}`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      // Header
      document.title = `${data.city} — This Week`;
      document.getElementById("header-title").textContent = `${data.city} — This Week`;
      document.getElementById("header-meta").textContent =
        `${fmtDateRange(data.week_start, data.week_end)}  ·  ${data.events.length} events`;

      const topPicks  = data.events.filter(e => (e.score || 0) >= TOP_PICK_THRESHOLD);
      const remaining = data.events.filter(e => (e.score || 0) <  TOP_PICK_THRESHOLD);

      // Top picks
      const topGrid = document.getElementById("top-picks-grid");
      if (topPicks.length > 0) {
        topPicks.forEach(e => topGrid.appendChild(buildCard(e, true)));
      } else {
        document.getElementById("top-picks-section").classList.add("hidden");
      }

      // All events
      const allGrid  = document.getElementById("all-events-grid");
      const cats     = [...new Set(remaining.map(e => e.category).filter(Boolean))];
      renderFilters(cats, allGrid);
      remaining.forEach(e => allGrid.appendChild(buildCard(e, false)));

      // Show content
      document.getElementById("loading-state").classList.add("hidden");
      document.getElementById("content").classList.remove("hidden");

    } catch (err) {
      document.getElementById("loading-state").classList.add("hidden");
      document.getElementById("error-message").textContent =
        `Could not load events for "${city}": ${err.message}`;
      document.getElementById("error-state").classList.remove("hidden");
    }
  }

  load();
</script>
</body>
</html>
