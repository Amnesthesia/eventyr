# Event sources for Gold Coast.
#
# Each entry declares how it is collected:
#   method: scraper — we fetch its listingUrls ourselves (src/adapters/).
#   method: llm     — no verified listing page, so LLM web search covers it.
#
# Everything else (homepage, venue, domains, notes, candidate listingUrls)
# is kept regardless of method, so promoting a source to scraper is a
# one-field change. `pnpm probe-sources --apply` does that promotion once
# it has verified a listing URL actually yields dated events.

name: Gold Coast
timezone: Australia/Brisbane
# See sources/brisbane.yml for what this is. 35 km from Southport reaches
# Coolangatta (21 km) and Tweed Heads (23 km) while excluding Brisbane (67 km).
centre:
  lat: -28.0167
  lng: 153.4000
  radiusKm: 35
