# Declarative source registry for the first-party adapter framework
# (replaces LLM tool-use fetching — see refactor prompt, Phase 1).
#
# IMPORTANT — provenance of this file: every entry below was written from a
# sandboxed session with NO outbound network access (confirmed via curl and
# WebFetch, both blocked by the environment's egress proxy). The task's
# "verified as live and correct at time of writing" table was taken as given
# and NOT independently re-verified here. Every "candidate" entry's
# homepage/domains were sourced, where available, from the existing
# LLM-discovered sources/brisbane.yml list — itself unverified. `strategy`
# for every entry below is an unconfirmed placeholder.
#
# Every entry is `enabled: false` as a result. Before Phase 3 writes an
# adapter for any entry, it must be fetched live, robots.txt and
# sitemap.xml checked, and the real strategy/listingUrls/domains confirmed
# — then flip enabled: true.

sources:
  # --- Seed table from the refactor prompt (author-asserted, not re-verified) ---

  - id: qagoma
    name: Queensland Art Gallery | Gallery of Modern Art (QAGOMA)
    homepage: https://www.qagoma.qld.gov.au/
    listingUrls:
      - https://www.qagoma.qld.gov.au/whats-on/events/
      - https://www.qagoma.qld.gov.au/whats-on/exhibitions/
    # qtix.com.au included per prompt instruction: QAGOMA sells through qtix,
    # so legacy-path suppression must also catch qtix pages for QAGOMA events.
    # NOTE this is a known-coarse rule: domain-level suppression can't tell a
    # qtix page for QAGOMA apart from a qtix page for an unrelated venue, so
    # this will over-suppress until Phase 5 does per-event matching instead.
    domains:
      - qagoma.qld.gov.au
      - qtix.com.au
    venue:
      name: Queensland Art Gallery | Gallery of Modern Art
      address: Stanley Place, South Bank
      suburb: South Brisbane
      lat: null
      lng: null
      aliases: [QAGOMA, GOMA, Queensland Art Gallery, Gallery of Modern Art]
    strategy: html
    enabled: false
    schedule: weekly
    note: >
      URL given by task as verified live; strategy not independently
      confirmed this session (network egress blocked) — likely jsonld or a
      WordPress/headless CMS API, needs live inspection before enabling.

