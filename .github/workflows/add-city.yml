name: Add New City

on:
  workflow_dispatch:
    inputs:
      city_name:
        description: "Full city name, e.g. Sydney, New South Wales, Australia"
        required: true
        type: string
      city_key:
        description: "Short slug, e.g. sydney (lowercase, no spaces)"
        required: true
        type: string

jobs:
  add-city:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Falls back to the default token when ADD_CITY_PAT isn't set yet.
          # That token can never push workflow-file changes, so the commit
          # step below only stages digest.yml when the PAT is present.
          token: ${{ secrets.ADD_CITY_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create city skeleton
        env:
          CITY_NAME: ${{ inputs.city_name }}
          CITY_KEY:  ${{ inputs.city_key }}
        run: pnpm tsx --tsconfig tsconfig.scripts.json src/add_city.ts

      - name: Discover sources
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: pnpm discover-sources --city=${{ inputs.city_key }} --apply

      - name: Probe sources
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: pnpm probe-sources --city=${{ inputs.city_key }} --apply

      - name: Commit result
        env:
          HAS_PAT: ${{ secrets.ADD_CITY_PAT != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$HAS_PAT" = "true" ]; then
            git add "sources/${{ inputs.city_key }}.yml" .github/workflows/digest.yml
          else
            echo "→ No ADD_CITY_PAT secret — leaving digest.yml's dispatch options untouched."
            git checkout -- .github/workflows/digest.yml
            git add "sources/${{ inputs.city_key }}.yml"
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "feat: add ${{ inputs.city_key }} event sources"
          git push
