name: Events Digest (reusable)

on:
  workflow_call:
    inputs:
      city:
        description: City slug matching a file in sources/ (e.g. brisbane)
        required: true
        type: string
      recipient:
        description: "WhatsApp recipient number (e.g. 61412345678). Defaults to WHATSAPP_RECIPIENT secret."
        required: false
        type: string
        default: ""
      force:
        description: "Re-collect even if this week's data already exists"
        required: false
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      PERPLEXITY_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      GOOGLE_API_KEY:
        required: false
      WHATSAPP_TOKEN:
        required: true
      WHATSAPP_PHONE_ID:
        required: true
      WHATSAPP_RECIPIENT:
        required: true

  workflow_dispatch:
    inputs:
      city:
        description: City to run the digest for
        required: true
        type: choice
        options:
          - brisbane
          - goldcoast
          - sunnycoast
      recipient:
        description: "WhatsApp recipient number (e.g. 61412345678). Leave blank to use the default."
        required: false
        type: string
        default: ""
      force:
        description: "Re-collect even if this week's data already exists"
        required: false
        type: boolean
        default: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Scrape first-party sources we have verified listing URLs for. Never
      # blocks the run: the AI search below still covers every method: llm
      # source regardless of how this goes.
      - name: Scrape adapter sources
        continue-on-error: true
        env:
          CITY: ${{ inputs.city }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: pnpm collect-adapters

      - name: Collect events
        env:
          CITY: ${{ inputs.city }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: pnpm collect

      - name: Curate events
        env:
          CITY: ${{ inputs.city }}
          FORCE: ${{ inputs.force }}
        run: pnpm curate

      - name: Rank events
        env:
          CITY: ${{ inputs.city }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: pnpm tsx --tsconfig tsconfig.scripts.json src/rank.ts

      - name: Geocode locations
        env:
          CITY: ${{ inputs.city }}
          FORCE: ${{ inputs.force }}
        run: pnpm tsx --tsconfig tsconfig.scripts.json src/geocode.ts

      - name: Write markdown
        run: pnpm tsx --tsconfig tsconfig.scripts.json src/markdown.ts

      - name: Generate iCal
        env:
          CITY: ${{ inputs.city }}
        run: pnpm tsx --tsconfig tsconfig.scripts.json src/ical.ts

      - name: Generate RSS feeds
        run: pnpm rss

      - name: Update pages index
        run: pnpm tsx --tsconfig tsconfig.scripts.json src/pages.ts

      - name: Build frontend
        run: pnpm build

      - name: Commit data files
        env:
          CITY: ${{ inputs.city }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/${CITY}.json" \
                  "data/${CITY}/" \
                  "${CITY^^}.md" "public/${CITY}.ics" "data/index.json" \
                  public/sitemap.xml public/*/feed.xml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update ${CITY} events $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep $((attempt * 10))
          done

      - name: Send WhatsApp digest
        continue-on-error: true
        if: false
        env:
          CITY: ${{ inputs.city }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_RECIPIENT: ${{ inputs.recipient != '' && inputs.recipient || secrets.WHATSAPP_RECIPIENT }}
        run: pnpm tsx --tsconfig tsconfig.scripts.json src/messaging.ts
