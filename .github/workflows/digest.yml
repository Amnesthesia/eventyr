name: Events Digest (reusable)

on:
  workflow_call:
    inputs:
      city:
        description: City slug matching a file in sources/ (e.g. brisbane)
        required: true
        type: string
      recipient:
        description: "WhatsApp recipient number (e.g. 61412345678). Defaults to WHATSAPP_RECIPIENT secret."
        required: false
        type: string
        default: ""
      force:
        description: "Re-collect even if this week's data already exists"
        required: false
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      PERPLEXITY_API_KEY:
        required: false
      GOOGLE_API_KEY:
        required: false
      WHATSAPP_TOKEN:
        required: true
      WHATSAPP_PHONE_ID:
        required: true
      WHATSAPP_RECIPIENT:
        required: true

  workflow_dispatch:
    inputs:
      city:
        description: City to run the digest for
        required: true
        type: choice
        options:
          - brisbane
          - goldcoast
            - sunnycoast
      recipient:
        description: "WhatsApp recipient number (e.g. 61412345678). Leave blank to use the default."
        required: false
        type: string
        default: ""
      force:
        description: "Re-collect even if this week's data already exists"
        required: false
        type: boolean
        default: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect events (parallel)
        env:
          CITY: ${{ inputs.city }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          python src/collection.py aggregators  &
          python src/collection.py institutions &
          python src/collection.py independents &
          python src/collection.py open          &
          wait

      - name: Curate events
        env:
          CITY: ${{ inputs.city }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: python src/curate.py

      - name: Write markdown
        run: python src/markdown.py

      - name: Generate iCal
        env:
          CITY: ${{ inputs.city }}
        run: python src/ical.py

      - name: Update pages index
        run: python src/pages.py

      - name: Commit data files
        env:
          CITY: ${{ inputs.city }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/${CITY}.json" \
                  "data/${CITY}/" \
                  "${CITY^^}.md" "${CITY}.ics" "data/index.json"
          git diff --cached --quiet || git commit -m "chore: update ${CITY} events $(date +%Y-%m-%d)"
          git push

      - name: Send WhatsApp digest
        continue-on-error: true
        if: false
        env:
          CITY: ${{ inputs.city }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_RECIPIENT: ${{ inputs.recipient != '' && inputs.recipient || secrets.WHATSAPP_RECIPIENT }}
        run: python src/messaging.py
