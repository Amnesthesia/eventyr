name: Events Digest (reusable)

on:
  workflow_call:
    inputs:
      city:
        description: City slug matching a file in sources/ (e.g. brisbane)
        required: true
        type: string
      recipient:
        description: "WhatsApp recipient number (e.g. 61412345678). Defaults to WHATSAPP_RECIPIENT secret."
        required: false
        type: string
        default: ""
      force:
        description: "Re-collect even if this week's data already exists"
        required: false
        type: boolean
        default: false
      providers:
        description: "Comma-separated search providers to run (google, anthropic, openai, perplexity). Keys can stay set for providers left out. anthropic and openai are off by default on cost: Claude web search was the priciest provider per event, and gpt-5 is the only OpenAI model with web search."
        required: false
        type: string
        default: "google,perplexity"
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      PERPLEXITY_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      GOOGLE_API_KEY:
        required: false
      WHATSAPP_TOKEN:
        required: true
      WHATSAPP_PHONE_ID:
        required: true
      WHATSAPP_RECIPIENT:
        required: true

  workflow_dispatch:
    inputs:
      city:
        description: City to run the digest for
        required: true
        type: choice
        options:
          - brisbane
          - goldcoast
          - sunnycoast
          - byron
      recipient:
        description: "WhatsApp recipient number (e.g. 61412345678). Leave blank to use the default."
        required: false
        type: string
        default: ""
      force:
        description: "Re-collect even if this week's data already exists"
        required: false
        type: boolean
        default: false
      providers:
        description: "Comma-separated search providers to run (google, anthropic, openai, perplexity). Keys can stay set for providers left out. anthropic and openai are off by default on cost: Claude web search was the priciest provider per event, and gpt-5 is the only OpenAI model with web search."
        required: false
        type: string
        default: "google,perplexity"

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One digest at a time across every caller. Two runs dispatched two minutes
    # apart raced on the shared generated files (sitemap, every city's feed,
    # index.json) and the later one lost its rebase and its whole city. Queued,
    # not cancelled: the second run still has a week to publish.
    concurrency:
      group: digest
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # The pipeline's "today" and week boundaries come from host local time
      # (getWeekRange / toISODate in src/common.ts). The runner is UTC; without
      # this a Sunday 06:00 AEST run is still Saturday there and targets the
      # week that is ending instead of the one starting tomorrow.
      TZ: Australia/Brisbane

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # actions/checkout defaults to the SHA that triggered this run, not
          # the branch's current tip. That's usually the same commit — but
          # when add-city.yml chains straight into this workflow, its own job
          # has just pushed sources/{city}.yml, and the default would miss it
          # entirely. Explicit ref name always resolves to the live tip.
          ref: ${{ github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type-check and lint before spending any API budget: neither ran in CI
      # before, which is how a broken tsconfig reference left the whole app
      # unchecked.
      - name: Typecheck and test
        run: |
          pnpm tsc --noEmit -p tsconfig.json
          pnpm tsc --noEmit -p tsconfig.scripts.json
          pnpm test

      # Fetch/extraction caches from the previous run. Pages are still fetched
      # every week for fresh events, but an unchanged page is a 304 (no body)
      # and its identical text hits the extraction cache, so only pages that
      # actually changed pay for an extraction call. Without this the caches
      # only ever existed on developer machines — a fresh runner re-extracted
      # every page every week.
      - name: Restore adapter caches
        uses: actions/cache@v4
        with:
          path: |
            data/_cache
            data/_raw
          key: adapters-${{ inputs.city }}-${{ github.run_id }}
          restore-keys: |
            adapters-${{ inputs.city }}-

      # For the handful of sources with strategy: render, whose events only
      # exist after JavaScript runs. A cached binary rather than
      # `playwright install`, which downloads ~95 MB every run. Not fatal:
      # collect-adapters degrades to the deterministic path with a warning if
      # no browser is available, so a bad install costs those few sources
      # rather than the whole scrape.
      - name: Set up chromium for render-strategy sources
        id: setup-chrome
        continue-on-error: true
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Scrape first-party sources we have verified listing URLs for. Never
      # blocks the run: the AI search below still covers every method: llm
      # source regardless of how this goes.
      - name: Scrape adapter sources
        continue-on-error: true
        env:
          CITY: ${{ inputs.city }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FORCE: ${{ inputs.force }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: pnpm collect-adapters

      - name: Collect events
        env:
          CITY: ${{ inputs.city }}
          # Explicit, so which providers run is visible in the workflow rather
          # than implied by which secrets happen to be set. A provider left out
          # here keeps its key and simply does not run.
          PROVIDERS: ${{ inputs.providers }}
          # Anthropic costs ~$0.06 per web search and nothing else about the
          # call matters, so it runs the two tiers where search beats scraping.
          # Revisit against data/{city}/usage/*.json (unique events per
          # provider) before widening.
          ANTHROPIC_TIERS: aggregators,institutions
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: pnpm collect

      - name: Curate events
        env:
          CITY: ${{ inputs.city }}
          # Required: curate.ts now runs the dedupe pair classifier.
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Geocodes aggregator-tier locations to throw out events a national
          # source listed under this city. Optional — without it every location
          # is kept unchecked, which is the safe direction.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: pnpm curate

      - name: Rank events
        env:
          CITY: ${{ inputs.city }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: pnpm tsx --tsconfig tsconfig.scripts.json src/rank.ts

      - name: Geocode locations
        env:
          CITY: ${{ inputs.city }}
          FORCE: ${{ inputs.force }}
        run: pnpm tsx --tsconfig tsconfig.scripts.json src/geocode.ts

      - name: Write markdown
        run: pnpm tsx --tsconfig tsconfig.scripts.json src/markdown.ts

      - name: Generate iCal
        env:
          CITY: ${{ inputs.city }}
        run: pnpm tsx --tsconfig tsconfig.scripts.json src/ical.ts

      - name: Generate RSS feeds
        run: pnpm rss

      - name: Update pages index
        run: pnpm tsx --tsconfig tsconfig.scripts.json src/pages.ts

      - name: Build frontend
        run: pnpm build

      - name: Commit data files
        env:
          CITY: ${{ inputs.city }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The per-event .ics files under public/*/e/ are committed for the
          # same reason the city feed is: deploy.yml runs only `astro build`
          # from a checkout, so anything public/ serves has to be in git.
          git add "data/${CITY}.json" \
                  "data/${CITY}/" \
                  "${CITY^^}.md" "public/${CITY}.ics" "data/index.json" \
                  public/sitemap.xml public/*/feed.xml public/*/e/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update ${CITY} events $(date +%Y-%m-%d)"
          # -X theirs: during a rebase "theirs" is this run's commit. Every file
          # it touches is regenerated output, so a content merge against a
          # concurrent push is meaningless — this run's version is the fresh one.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((attempt * 10))
          done
          # Without this the loop's last command is `sleep`, which exits 0 —
          # three failed pushes reported success and the week's data was
          # discarded with the runner, with nothing red anywhere.
          echo "::error::failed to push after 3 attempts"
          exit 1

      - name: Send WhatsApp digest
        continue-on-error: true
        if: false
        env:
          CITY: ${{ inputs.city }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_RECIPIENT: ${{ inputs.recipient != '' && inputs.recipient || secrets.WHATSAPP_RECIPIENT }}
        run: pnpm tsx --tsconfig tsconfig.scripts.json src/messaging.ts
