name: Events — Weekly Digest

on:
  schedule:
    # Every Monday at 6:00 AM AEST (UTC+10) = 20:00 UTC Sunday
    - cron: "0 20 * * 0"

  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      force:
        description: "Re-collect even if this week's data already exists"
        required: false
        type: boolean
        default: false

jobs:
  brisbane:
    uses: ./.github/workflows/digest.yml
    permissions:
      contents: write
    with:
      city: brisbane
      force: ${{ inputs.force || false }}
    secrets: inherit
  goldcoast:
    needs: brisbane
    uses: ./.github/workflows/digest.yml
    permissions:
      contents: write
    with:
      city: goldcoast
      force: ${{ inputs.force || false }}
    secrets: inherit
  sunnycoast:
    needs: goldcoast
    uses: ./.github/workflows/digest.yml
    permissions:
      contents: write
    with:
      city: sunnycoast
      force: ${{ inputs.force || false }}
    secrets: inherit
