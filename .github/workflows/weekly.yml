name: Events — Weekly Digest

on:
  schedule:
    # Every Sunday at 6:00 AM AEST (UTC+10) = 20:00 UTC Saturday. Targets the
    # week starting tomorrow (getWeekRange's Sunday branch, with TZ set in
    # digest.yml) so the coming week can be planned on Sunday; today's leftover
    # events are carried forward by curate rather than dropped.
    - cron: "0 20 * * 6"

  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      force:
        description: "Re-collect even if this week's data already exists"
        required: false
        type: boolean
        default: false
      providers:
        description: "Comma-separated search providers to run"
        required: false
        type: string
        default: "google,anthropic,perplexity"

jobs:
  brisbane:
    uses: ./.github/workflows/digest.yml
    permissions:
      contents: write
    with:
      city: brisbane
      force: ${{ inputs.force || false }}
      providers: ${{ inputs.providers || 'google,anthropic,perplexity' }}
    secrets: inherit
  goldcoast:
    needs: brisbane
    uses: ./.github/workflows/digest.yml
    permissions:
      contents: write
    with:
      city: goldcoast
      force: ${{ inputs.force || false }}
      providers: ${{ inputs.providers || 'google,anthropic,perplexity' }}
    secrets: inherit
  sunnycoast:
    needs: goldcoast
    uses: ./.github/workflows/digest.yml
    permissions:
      contents: write
    with:
      city: sunnycoast
      force: ${{ inputs.force || false }}
      providers: ${{ inputs.providers || 'google,anthropic,perplexity' }}
    secrets: inherit
